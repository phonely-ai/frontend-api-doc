name: Docs CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: latest

      # Strict build validation catches malformed docs.json / navigation,
      # the realistic "site down" failure for a Mintlify deploy.
      - name: Build validation
        run: npx --yes mint@latest validate

      # Custom checker instead of `mint broken-links`, which false-positives
      # on pages nested in docs.json sub-groups (see scripts/check-links.mjs).
      - name: Internal links & media references
        run: node scripts/check-links.mjs

      - name: Frontmatter contract
        run: node scripts/check-frontmatter.mjs

      - name: Freshness contract
        run: node scripts/freshness-ledger.mjs

      - name: Orphan media
        run: node scripts/find-orphan-media.mjs --fail-on-orphans

      - name: Indexing contract
        run: node scripts/check-indexing-contract.mjs

      - name: OpenAPI contract
        run: node scripts/check-openapi-contract.mjs
