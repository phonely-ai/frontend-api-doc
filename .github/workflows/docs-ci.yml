name: Docs CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Strict build validation catches malformed docs.json / navigation,
      # the realistic "site down" failure for a Mintlify deploy.
      - name: Build validation
        run: npx --no-install mint validate

      # Custom checker instead of `mint broken-links`, which false-positives
      # on pages nested in docs.json sub-groups (see scripts/check-links.mjs).
      - name: Internal links & media references
        run: node scripts/check-links.mjs

      - name: Frontmatter contract
        run: node scripts/check-frontmatter.mjs

      - name: Freshness contract
        run: node scripts/freshness-ledger.mjs

      - name: Review date regression tests
        run: node --test scripts/check-review-dates.test.mjs scripts/docs-impact.test.mjs scripts/check-docs-questions.test.mjs

      - name: Changed page review dates
        if: github.event_name == 'pull_request'
        env:
          REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-review-dates.mjs "$REVIEW_BASE_SHA"

      - name: Orphan media
        run: node scripts/find-orphan-media.mjs --fail-on-orphans

      - name: Indexing contract
        run: node scripts/check-indexing-contract.mjs

      - name: OpenAPI contract
        run: node scripts/check-openapi-contract.mjs

      - name: Question corpus contract
        run: node scripts/check-docs-questions.mjs
